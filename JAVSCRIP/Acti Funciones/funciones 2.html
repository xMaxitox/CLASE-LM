<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Visualizar un saludo con vuestro nombre dentro de una función-->
<p id="resultado"></p>
<script>

                 //-----FUNCIONES-----
function saludo(nom){
    alert('Hola' + nom);
    document.getElementById("resultado").innerHTML="Hola" + nom + " ¿que tal estas?";
}
                //-----PROGRAMA PRINCIPAL-----

let nombre=" Adrian";
saludo(nombre);
</script>

</body>
</html>
